4 \\approx 1.348\\times10^{-3}\\ m^2$\n- 缩回推力（同压力）：$F_2 \\approx 13.5$ kN\n- 伸出速度：$v_1 = Q/A_1 = \\frac{20/1000/60}{1.963\\times10^{-3}} \\approx 0.17\\ m/s = 170$ mm/s\n**读法**：伸出与缩回的力差约 31%，速度差约 46%，都是面积差造成的，**不是故障**。判断故障要看\"同一负载下速度是否明显低于设计值\"。"}, {"title": "数字例子：保压压降估内泄漏", "body": "缸在 10 MPa 下保压，测得 1 分钟后压力降到 9.2 MPa。缸与管路总容积 $V = 2$ L，油液体积弹性模量取 $K = 1.4$ GPa。\n压力降：$\\Delta p = 0.8$ MPa。由 $\\Delta V = V \\cdot \\Delta p/K = 2\\times10^{-3} \\times 0.8\\times10^{6}/1.4\\times10^{9} \\approx 1.14\\ mL$。\n**读法**：1 分钟漏掉约 1.1 mL，等效泄漏率约 **1 mL/min**。这与 `valve.md` 里 5 µm 间隙的泄漏量同量级，说明\"密封良好时本来就漏得很少\"——一旦测到几十 mL/min 的压降速率，基本可以判定内泄漏。"}], "count": 32, "group": "对象"}, {"file": "gearbox", "title": "齿轮箱", "intro": ["齿轮箱是旋转机械里\"特征频率最规整、也最容易被算错\"的对象：所有故障特征都挂在**啮合频率**和**转频**这两根轴上。这册先把频率算对，再讲故障怎么改频谱形状。", "每行 = 术语 | 一句话定义 | 生活化比喻 | 信号里怎么体现。"], "tables": [{"headers": ["术语", "一句话定义", "生活化比喻", "信号里怎么体现"], "rows": [["齿轮箱（Gearbox）", "用齿啮合改变转速与转矩的传动装置", "自行车的变速器", "振动以啮合频率为主，故障改变边带与调制"], ["齿数 z", "每个齿轮的轮齿数", "齿轮的\"牙\"数", "决定啮合频率与传动比，必须先从图纸或转速确认"], ["转频 fr", "某根轴每秒转多少圈", "心跳", "输入/输出各有一个，是所有边带间距的来源"], ["传动比 i", "输入转速与输出转速之比 `i = z2/z1 = fr1/fr2`", "变速档位", "从转速差可以反推齿数比，验证齿数是否算错"], ["啮合频率 GMF", "单位时间内有多少对齿啮合 `GMF = z·fr`", "每秒咬合多少次", "频谱上最强的成分之一，故障在它两侧长边带"], ["啮合谐波", "2×GMF、3×GMF 等", "主音的高八度", "早期磨损使高次谐波抬升"], ["调制（Modulation）", "一个频率的幅值/相位被另一个慢信号周期性改变", "音量的周期性起伏", "出现\"载波 ± 调制频率\"的边带"], ["边带（Sideband）", "主峰两侧间隔等于调制频率的成分", "主音旁的和声", "边带间距 = 哪根轴的转频，就说明哪根轴上的齿轮有问题"], ["边带族", "多条等间距边带", "一串和声", "间距均匀 → 单齿缺陷；间距混杂 → 多齿或轴系问题"], ["齿根裂纹", "齿根部疲劳开裂", "牙根裂了", "早期几乎看不见，后期出现 1×转频调制与冲击"], ["断齿（Broken Tooth）", "整齿或部分齿折断", "掉了一颗牙", "每转一次的强冲击，时域出现周期性脉冲，频谱边带密集"], ["点蚀 / 剥落", "齿面接触疲劳形成小坑", "牙面蛀了个洞", "啮合频率处能量上升并伴随宽带噪声"], ["齿面磨损", "齿厚减薄的均匀或非均匀损失", "牙磨平了", "啮合谐波整体抬升、齿隙变大、噪声上升"], ["胶合（Scuffing）", "润滑失效导致齿面局部熔焊撕裂", "干摩擦把牙蹭掉", "突发性高频能量与温升，常无先兆"], ["齿隙（Backlash）", "一对齿非工作面之间的间隙", "两颗牙之间的空档", "换向冲击、低速敲击声，频谱出现转频谐波"], ["啮合刚度", "啮合过程中齿对刚度随啮合位置变化", "咬合时忽硬忽软", "造成 GMF 及其谐波，是\"齿轮箱天然有边带\"的根源"], ["传递误差（TE）", "实际输出转角与理想转角的偏差", " \\times 50/2 = 1500$ rpm\n- 实际转速：$n = 1500 \\times 0.98 = 1470$ rpm → 转频 $f_r = 24.5$ Hz\n- 叶片通过频率：$BPF = z f_r = 7 \\times 24.5 = 171.5$ Hz\n**读法**：171.5 Hz 及其 2×（343 Hz）在频谱里通常是\"正常也很大\"的成分，不能当成故障。真正要看的是：**BPF 两侧是否出现转频间隔的边带**（说明单个叶片损伤）、**BPF 幅值是否随流量剧烈变化**（说明间隙或汽蚀）。"}, {"title": "数字例子：容积效率掉了多少", "body": "某齿轮泵理论流量 $Q_t = 20$ L/min。出口压力 5 MPa 时实测 $Q = 18$ L/min，10 MPa 时实测 $Q = 15$ L/min。\n- 5 MPa：$\\eta_v = 18/20 = 0.90$\n- 10 MPa：$\\eta_v = 15/20 = 0.75$\n**读法**：同一台泵，压力翻倍容积效率掉 15 个百分点，说明内泄漏随压差显著增大——**间隙磨损的典型指纹**。如果两个压力下效率都差不多低，那更像是吸油不畅或气缚，而不是磨损。"}], "count": 32, "group": "对象"}, {"file": "rcc", "title": "导电滚环 RCC", "intro": ["**RCC = 导电滚环（Conductive Rolling Ring），用户语境下就指它**：靠滚动接触而非滑动接触把电流从静止侧送到旋转侧的环形导电部件。它的特殊之处是\"电\"与\"摩擦\"在同一界面上耦合——磨损改变接触、电弧又反过来烧蚀金属。", "每行 = 术语 | 一句话定义 | 生活化比喻 | 故障/退化时的表现。", "注意：滚环与滑环（slip ring）不是同一种东西，前者靠滚动、后者靠滑动；很多文献混用，读到时要看原文的接触方式。"], "tables": [{"headers": ["术语", "一句话定义", "生活化比喻", "故障/退化时的表现"], "rows": [["导电滚环（RCC）", "用滚子/滚珠在环面上滚动实现旋转侧导电的部件", "给旋转的吊扇送电的\"滚动的插头\"", "接触电阻波动、滚道点蚀、磨屑桥接"], ["滚动接触 vs 滑动接触", "接触点相对速度为零 / 存在相对滑移", "轮胎滚动 / 轮胎打滑", "滚动磨损低但接触面积小、易间歇；滑动磨损大但接触稳定"], ["滚环本体", "与转动轴同轴、表面镀导电层的环件", "电的\"跑道\"", "环面沟槽、镀层磨穿、椭圆度变大"], ["滚子 / 滚珠", "在环面与静止件之间滚动的导电体", "跑在跑道上的跑者", "点蚀、压痕（brinelling）、碎裂"], ["电刷 / 触点（Brush / Contact）", "与环面保持压力接触的导电件（部分结构为弹片）", "压在跑道上的\"手指\"", "磨损变短、压力衰减、接触面烧蚀"], ["刷握与弹簧", "固定触点并提供接触压力的机构", "手指按下去的力度", "弹簧疲劳 → 压力不足 → 接触电阻升高、打火"], ["接触压力", "触点与环面之间的法向力", "按多紧", "过小打火，过大磨损加快，存在最佳区间"], ["收缩电阻（Constriction Resistance）", "电流挤过微小真实接触点产生的电阻", "多车道变单车道", "表面越粗糙、压力越小，收缩电阻越大"], ["膜电阻（Film Resistance）", "氧化膜/污染膜带来的附加电阻", "接头上的一层锈", "呈非线性、随电压变化，是\"接触电阻为什么时大时小\"的主因"], ["接触电阻 `R_c`", "界面等效电阻，`R_c ≈ ρ/(2a) + R_film`（单点，a 为接触斑点半径）", "两个金属面只有几个点真的碰上", "缓慢上升 = 退化；跳变 = 电弧或磨屑"], ["动态接触电阻波动（DCR fluctuation）", "旋转一圈内接触电阻的周期性起伏", "灯一闪一闪", "随转角周期变化，频谱上出现转频及其倍频"], ["接触压降", "电流通过接触界面产生的电压降 `U = I·R_c`", "水管接头处的水压损失", "压降缓慢抬升是早期征兆；突增说明接触失效"], ["载流密度", "单位接触面积通过的电流", "每根车道上的车流", "超限 → 局部过热与电蚀加速"], ["温升", "焦耳热与摩擦热共同引起的温度上升", "一直摩擦的手心发烫", "与 `I²R` 和摩擦功率相关 $，从 $2 \\times 0.005 = 10$ mV 变到 $2 \\times 0.05 = 100$ mV\n- 接触点焦耳热：$P = I^2 R_c$，从 $4 \\times 0.005 = 20$ mW 变到 $4 \\times 0.05 = 200$ mW\n**读法**：10 mV 的压降在 24 V 系统里只占 0.04%，传感器完全看不出来；但 200 mW 集中在几十微米的接触斑点上，足以让局部温度显著上升。所以**早期征兆是温升，不是电压**。"}, {"title": "数字例子三：一次打火烧掉多少能量", "body": "24 V、2 A 的回路，触点弹跳持续 $200\\ \\mu s$：\n$E = u\\,i\\,t = 24 \\times 2 \\times 200\\times10^{-6} = 9.6\\times10^{-3}\\ J \\approx 9.6$ mJ。\n**读法**：9.6 mJ 听起来很小，但假设一次弹跳烧蚀掉约 $10^{-12}$ m³ 量级的金属、并且每秒弹跳几十次，转一小时的累积损伤就足以在环面上留下可见凹坑。这就是\"电蚀是累积量、不是单次事件\"的物理含义。"}], "count": 34, "group": "对象"}, {"file": "valve", "title": "液压电磁阀", "intro": ["液压电磁阀是\"电 → 磁 → 力 → 位移 → 流量/压力\"的多级转换件，故障往往先出现在中间某一级。这册按这条链组织：线圈、磁路、阀芯、阀口、油液。", "每行 = 术语 | 一句话定义 | 生活化比喻 | 故障时的典型表现。"], "tables": [{"headers": ["术语", "一句话定义", "生活化比喻", "故障时的典型表现"], "rows": [["电磁阀", "用电信号控制液压油路通断/方向/压力的元件", "油路的红绿灯加闸门", "不动作、动作慢、抖动、内泄"], ["阀芯 / 阀套", "阀内相对滑动的柱塞与套筒，二者间隙决定泄漏", "注射器活塞与筒壁", "间隙磨大 → 内泄漏；污染 → 卡滞"], ["配合间隙（Clearance）", "阀芯与阀套之间的径向间隙，通常几微米", "活塞与筒壁那一丝缝", "泄漏与间隙是**三次方**关系，间隙翻倍泄漏约 8 倍"], ["内泄漏", "高压腔向低压腔的泄漏流量", "水龙头关不严还滴水", "保压能力下降，压力曲线缓慢下滑，油温升高"], ["卡滞（Stiction）", "阀芯因污染/磨损/油膜吸附卡住不动", "抽屉滑轨卡住", "指令与响应不同步，出现滞环、台阶、死区变大"], ["滞环（Hysteresis）", "同一控制量在上升与下降行程中对应不同输出", "老式收音机旋钮的回差", "闭环控制振荡，压力/流量曲线出现回环"], ["死区（Deadband）", "输入变化但输出不变化的区间", "方向盘的空行程", "小信号控制迟钝，低频跟踪误差大"], ["线圈（Solenoid Coil）", "通电产生磁力驱动阀芯的绕组", "电磁铁", "匝间短路、老化 → 电流曲线畸变、吸合力下降"], ["匝间短路", "线圈内部相邻匝绝缘破坏而短接", "弹簧有几圈粘在一起", "等效电阻下降、电感下降、温升异常"], ["线圈电阻", "绕组的直流电阻，随温度上升", "导线的\"粗细\"", "冷态/热态差异大，可用作温度估计"], ["电感与时间常数", "`τ = L/R`，决定电流上升快慢", "水管灌满需要的时间", "阀芯吸合瞬间电感突变，电流曲线出现拐点"], ["吸合电流 / 保持电流", "克服弹簧与液压力所需 / 维持吸合所需电流", "推开门要用力，扶着不用", "吸合电流上升说明摩擦或液压力变大"], ["电磁力", "`F = B²A/(2μ0)`，与气隙磁密平方成正比", "磁铁的吸力", "气隙增大（磨损）→ 力迅速下降"], ["气隙（Air Gap）", "磁路中的非磁性间隙", "磁铁与被吸物之间的空隙", "磨损或装配误差使气隙变大，响应变慢"], ["剩磁", "断电后铁芯残留的磁感应", "关掉电磁铁还粘着", "断电释放延迟，回位不到位"], ["弹簧复位", "断电后靠弹簧把阀芯推回原位", "松手自动回弹的门", "弹簧疲劳 → 复位慢或不到位"], ["响应时间", "从给电到阀芯到位的时间", "指令到执行的反应速度", "上升 → 系统动态变差，严重时动作失败"], ["开启压力 / 关闭压力", "阀开始/停止导通对应的压力", "水龙头的开启水压", "与设计值 const volumes = DATA.volumes;
const chipsEl = document.getElementById("chips");
const listEl = document.getElementById("list");
const qEl = document.getElementById("q");
const countEl = document.getElementById("count");
let active = null;

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}
function hl(text, terms) {
  let out = esc(text);
  terms.forEach(function (t) {
    if (!t) return;
    const safe = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    out = out.replace(new RegExp(safe, "gi"), function (m) { return "<mark>" + m + "</mark>"; });
  });
  return out;
}

// 路由表（默认收起，打印时展开）
(function () {
  const el = document.getElementById("routes");
  if (!DATA.routes.length) return;
  const rows = DATA.routes.map(function (r) {
    return "<tr><td>" + esc(r.direction) + "</td><td>" + esc(r.must) + "</td><td>" + esc(r.optional) + "</td></tr>";
  }).join("");
  el.innerHTML = "<details><summary>按论文方向选册（" + DATA.routes.length +
    " 行，来自 field-glossary.md）</summary><table><thead><tr><th>论文方向</th><th>必读</th><th>可选</th></tr></thead><tbody>" +
    rows + "</tbody></table></details>";
})();

// 分册筛选
const allChip = document.createElement("button");
allChip.className = "chip";
allChip.textContent = "全部";
allChip.dataset.file = "";
chipsEl.appendChild(allChip);
volumes.forEach(function (v) {
  const b = document.createElement("button");
  b.className = "chip";
  b.textContent = v.title + " " + v.count;
  b.dataset.file = v.file;
  chipsEl.appendChild(b);
});
chipsEl.addEventListener("click", function (e) {
  const b = e.target.closest(".chip");
  if (!b) return;
  active = b.dataset.file || null;
  Array.prototype.forEach.call(chipsEl.children, function (c) {
    c.setAttribute("aria-pressed", String((c.dataset.file || "") === (active || "")));
  });
  render();
});
allChip.setAttribute("aria-pressed", "true");

function render() {
  const raw = qEl.value.trim();
  const terms = raw ? raw.split(/\s+/).filter(Boolean) : [];
  let total = 0;
  const parts = [];

  volumes.forEach(function (v) {
    if (active && v.file !== active) return;
    const blocks = [];
    let volHits = 0;
    v.tables.forEach(function (t, ti) {
      const hits = t.rows.filter(function (r) {
        const hay = (r.join(" ") + " " + v.title).toLowerCase();
        return terms.every(function (x) { return hay.indexOf(x.toLowerCase()) >= 0; });
      });
      if (!hits.length) return;
      volHits += hits.length;
      const head = t.headers.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("");
      const body = hits.map(function (r) {
        return '<tr class="' + (terms.length ? "hit" : "") + '">' + r.map(function (c) {
          return "<td>" + hl(c, terms) + "</td>";
        }).join("") + "</tr>";
      }).join("");
      const cap = (ti > 0 && t.caption) ? "<p class=\"intro\">" + esc(t.caption) + "</p>" : "";
      blocks.push(cap + "<table><thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>");
    });
    if (!volHits) return;
    total += volHits;
    const ex = (!terms.length || !v.examples.length) ? "" :
      "<details><summary>本册数字例子（" + v.examples.length + " 个）</summary>" +
      v.examples.map(function (e) {
        return "<p><b>" + esc(e.title) + "</b></p><pre>" + esc(e.body) + "</pre>";
      }).join("") + "</details>";
    parts.push('<section class="vol"><h2>' + esc(v.title) + " <small>" + esc(v.group) + " · " +
      volHits + ' 条</small></h2>' +
      (v.intro.length ? '<p class="intro">' + esc(v.intro.join(" ")) + "</p>" : "") +
      blocks.join("") + ex + "</section>");
  });

  listEl.innerHTML = parts.join("") || '<div class="empty">没有匹配的条目。换个关键词，或点"全部"。</div>';
  countEl.textContent = "命中 " + total + " 条";
}

qEl.addEventListener("input", render);
document.addEventListener("keydown", function (e) {
  if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); }
  if (e.key === "Escape") { qEl.value = ""; render(); qEl.blur(); }
});
render();
</script>
